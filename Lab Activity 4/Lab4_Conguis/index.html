<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSIT Student Status Board</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        h1 {
            margin-bottom: 20px;
        }

        #statusMessage {
            font-size: 1.2rem;
            font-weight: bold;
            min-height: 24px;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 18px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 6px;
            border: 1px solid #ccc;
            margin-right: 10px;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <h1>BSIT Student Status Board</h1>
    <p id="statusMessage"></p>
    <button id="enrollBtn">Check Enrollment</button>
    <button id="themeBtn">Toggle Dark Mode</button>

    <script src="script.js"></script>
</body>
</html>
